{{- if not .Values.existingSecret }}
{{- if and (not .Values.systemToken) (not .Values.kubernetesAuth.enabled) }}
{{- fail "A Vault system token is required: set .Values.systemToken, .Values.existingSecret, or enable .Values.kubernetesAuth.enabled" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "vaultlens.fullname" . }}
  labels:
    {{- include "vaultlens.labels" . | nindent 4 }}
type: Opaque
data:
  vault-system-token: {{ .Values.systemToken | default "" | b64enc | quote }}
{{- end }}
