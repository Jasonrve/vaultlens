services:
  k3s:
    image: rancher/k3s:v1.31.5-k3s1
    container_name: vaultlens-k3s
    privileged: true
    command: server --disable=traefik --tls-san=k3s --write-kubeconfig=/shared/k3s.yaml --write-kubeconfig-mode=644
    ports:
      - "6443:6443"
    volumes:
      - k3s-data:/var/lib/rancher/k3s
      - k3s-shared:/shared
    healthcheck:
      test: ["CMD-SHELL", "kubectl get --raw=/readyz >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30

  k3s-vso-fixture:
    image: rancher/k3s:v1.31.5-k3s1
    container_name: vaultlens-k3s-vso-fixture
    depends_on:
      k3s:
        condition: service_healthy
    environment:
      KUBECONFIG: /shared/k3s.yaml
    volumes:
      - k3s-shared:/shared
      - ./vault/scripts:/vault/scripts:ro
    entrypoint: /bin/sh
    command: /vault/scripts/k3s-vso-fixture.sh
    restart: "no"

  vault:
    image: hashicorp/vault:1.17
    container_name: vaultlens-vault
    cap_add:
      - IPC_LOCK
    ports:
      - "8200:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: "root"
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
      VAULT_ADDR: "http://127.0.0.1:8200"
      VAULT_API_ADDR: "http://127.0.0.1:8200"
      VAULT_DISABLE_MLOCK: "true"
      # Enable Prometheus telemetry endpoint on /v1/sys/metrics
      VAULT_TELEMETRY_PROMETHEUS_RETENTION_TIME: "60s"
    volumes:
      - ./vault/policies:/vault/policies:ro
      - ./vault/scripts:/vault/scripts:ro
      - ./vault/audit:/vault/audit
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  vault-init:
    image: hashicorp/vault:1.17
    container_name: vaultlens-vault-init
    depends_on:
      vault:
        condition: service_healthy
      k3s-vso-fixture:
        condition: service_completed_successfully
    environment:
      VAULT_ADDR: "http://vault:8200"
      VAULT_TOKEN: "root"
      K8S_ACCESS_K3S: "${K8S_ACCESS_K3S:-}"
      # Optional OIDC configuration — set these in your root .env file to enable
      # full OIDC login in VaultLens. See .env.example for details.
      OIDC_DISCOVERY_URL: "${OIDC_DISCOVERY_URL:-}"
      OIDC_CLIENT_ID: "${OIDC_CLIENT_ID:-}"
      OIDC_CLIENT_SECRET: "${OIDC_CLIENT_SECRET:-}"
      OIDC_DEFAULT_ROLE: "${OIDC_DEFAULT_ROLE:-vault-admin}"
      OIDC_REDIRECT_URI: "${OIDC_REDIRECT_URI:-http://localhost:3001/oidc-callback/oidc}"
      OIDC_TOKEN_POLICIES: "${OIDC_TOKEN_POLICIES:-admin,vaultlens-admin}"
    volumes:
      - ./vault/policies:/vault/policies:ro
      - ./vault/scripts:/vault/scripts:ro
      - k3s-shared:/shared:ro
    entrypoint: /bin/sh
    command: /vault/scripts/bootstrap.sh
    restart: "no"

  # Optional — generates a few deliberately-failing Vault logins so the audit
  # error badges in the UI have example data on a fresh `docker compose up`.
  # Waits for VaultLens itself to be listening on the audit socket before
  # firing, so it's safe to start alongside vault/vault-init.
  vault-audit-demo:
    image: hashicorp/vault:1.17
    container_name: vaultlens-vault-audit-demo
    depends_on:
      vault:
        condition: service_healthy
    environment:
      VAULT_ADDR: "http://vault:8200"
      VAULT_TOKEN: "root"
      VAULT_AUDIT_SOCKET_VAULT_ADDRESS: "${VAULT_AUDIT_SOCKET_VAULT_ADDRESS:-host.docker.internal:9090}"
    volumes:
      - ./vault/scripts:/vault/scripts:ro
    entrypoint: /bin/sh
    command: /vault/scripts/audit-demo-seed.sh
    restart: "no"

  vaultlens:
    image: node:22-alpine
    container_name: vaultlens-app
    user: "1001:1001"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    entrypoint: ["/usr/local/bin/vaultlens-entrypoint"]
    working_dir: /app
    depends_on:
      vault:
        condition: service_healthy
      k3s-vso-fixture:
        condition: service_completed_successfully
    environment:
      PORT: "3001"
      NODE_ENV: "development"
      VAULT_ADDR: "http://vault:8200"
      VAULT_SYSTEM_TOKEN: "root"
      K8S_ACCESS_K3S: "${K8S_ACCESS_K3S:-}"
      K8S_SKIP_TLS_VERIFY: "${K8S_SKIP_TLS_VERIFY:-true}"
      K8S_SERVICE_ACCOUNT_NAME: "${K8S_SERVICE_ACCOUNT_NAME:-vaultlens-vso-reader}"
      K8S_SERVICE_ACCOUNT_NAMESPACE: "${K8S_SERVICE_ACCOUNT_NAMESPACE:-default}"
      K8S_IAM_ROLE_NAME: "${K8S_IAM_ROLE_NAME:-}"
      VAULT_SKIP_TLS_VERIFY: "false"
      VAULT_AUDIT_SOURCE: "socket"
      VAULT_AUDIT_SOCKET_PORT: "9090"
      VAULT_AUDIT_SOCKET_HOST: "0.0.0.0"
      # Vault connects to the vaultlens service by name on the shared Docker network
      VAULT_AUDIT_SOCKET_VAULT_ADDRESS: "vaultlens:9090"
      VAULTLENS_CONFIG_STORAGE: "file"
      VAULTLENS_DEBUG_SHELL: "${VAULTLENS_DEBUG_SHELL:-false}"
      npm_config_cache: "/tmp/npm-cache"
    ports:
      - "3001:3001"
    volumes:
      - ./app:/app
      - ./docker-entrypoint.sh:/usr/local/bin/vaultlens-entrypoint:ro
      - k3s-shared:/var/run/secrets/kubernetes.io/serviceaccount:ro
    command: sh -c "npm install && rm -rf dist && npm run build && npm start"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/api/health > /dev/null 2>&1 && echo OK || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s

volumes:
  k3s-data:
  k3s-shared:
